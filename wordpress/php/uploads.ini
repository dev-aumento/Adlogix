; PHP upload limits for the WordPress container (official wordpress:*-apache image).
; Mount as /usr/local/etc/php/conf.d/uploads.ini - see docs/wordpress-migration/05-media-uploads.md
; post_max_size must stay larger than upload_max_filesize.

file_uploads = On
upload_max_filesize = 256M
post_max_size = 300M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
